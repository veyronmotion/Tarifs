<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEYRØN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500&display=swap');

  :root{
    --bg: #0A0D13;
    --card: #131B26;
    --card-border: rgba(255,255,255,0.07);
    --text: #F3F5F8;
    --muted: #7C93A8;
    --line: rgba(255,255,255,0.08);
    --accent: #5FA8E0;
    --accent-soft: rgba(95,168,224,0.30);
  }

  *{ box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(95,168,224,0.10) 0%, transparent 60%),
      linear-gradient(180deg, rgba(10,13,19,0.94) 0%, rgba(10,13,19,0.90) 40%, rgba(10,13,19,0.97) 100%);
  }

  .wrap{
    text-align:center;
    max-width:420px;
    width:100%;
  }

  .wordmark{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(42px, 10vw, 60px);
    letter-spacing:0.03em;
    margin:0;
    background:linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 45%, var(--accent) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:neonPulse 4s ease-in-out infinite;
  }

  @keyframes neonPulse{
    0%, 100%{ filter:drop-shadow(0 0 14px rgba(95,168,224,0.30)); }
    50%{ filter:drop-shadow(0 0 24px rgba(95,168,224,0.55)); }
  }

  .tagline{
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--muted);
    margin:16px 0 48px;
    font-weight:400;
  }

  .lang-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }

  .lang-card{
    background:var(--card);
    border:1px solid var(--accent);
    border-radius:16px;
    padding:28px 16px;
    text-decoration:none;
    color:var(--text);
    display:block;
    animation:glowPulse 3.5s ease-in-out infinite;
    transition:transform .2s ease;
  }

  .lang-card:hover{ transform:translateY(-2px); }

  .lang-card:nth-child(2){ animation-delay:.4s; }

  @keyframes glowPulse{
    0%, 100%{ box-shadow:0 0 0 1px var(--accent), 0 0 22px var(--accent-soft), 0 8px 24px rgba(0,0,0,0.35); }
    50%{ box-shadow:0 0 0 1px var(--accent), 0 0 38px rgba(95,168,224,0.5), 0 8px 24px rgba(0,0,0,0.35); }
  }

  .lang-code{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:28px;
    letter-spacing:0.04em;
    margin:0 0 6px;
  }

  .lang-label{
    font-size:12px;
    color:var(--muted);
    margin:0;
  }

  @media (prefers-reduced-motion: reduce){
    .wordmark, .lang-card{ animation:none; }
    .lang-card{ box-shadow:0 0 0 1px var(--accent), 0 0 22px var(--accent-soft), 0 8px 24px rgba(0,0,0,0.35); }
  }
</style>
</head>
<body>

  <div class="wrap">
    <p class="wordmark">VEYRØN</p>
    <p class="tagline">Cinematic Content</p>

    <div class="lang-grid">
      <a class="lang-card" href="fr.html">
        <p class="lang-code">FR</p>
        <p class="lang-label">Français</p>
      </a>
      <a class="lang-card" href="en.html">
        <p class="lang-code">EN</p>
        <p class="lang-label">English</p>
      </a>
    </div>
  </div>

</body>
</html>
